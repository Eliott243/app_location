<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#0b1a2d"/>
      <stop offset="45%" stop-color="#14375e"/>
      <stop offset="100%" stop-color="#1f4f7a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.2" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0%" stop-color="#f28c28" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#f28c28" stop-opacity="0"/>
      <stop offset="100%" stop-color="#14375e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1a2d" stop-opacity="0"/>
      <stop offset="100%" stop-color="#06101c" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <!-- soft city silhouette -->
  <g fill="#0b1a2d" opacity="0.55">
    <rect x="80" y="520" width="70" height="220"/>
    <rect x="170" y="460" width="90" height="280"/>
    <rect x="280" y="500" width="55" height="240"/>
    <rect x="360" y="430" width="110" height="310"/>
    <rect x="490" y="480" width="70" height="260"/>
    <rect x="580" y="400" width="130" height="340"/>
    <rect x="730" y="450" width="80" height="290"/>
    <rect x="830" y="380" width="100" height="360"/>
    <rect x="950" y="470" width="60" height="270"/>
    <rect x="1030" y="420" width="140" height="320"/>
    <rect x="1190" y="500" width="75" height="240"/>
    <rect x="1285" y="440" width="95" height="300"/>
    <rect x="1400" y="510" width="120" height="230"/>
  </g>
  <rect width="1600" height="900" fill="url(#ground)"/>
</svg>
